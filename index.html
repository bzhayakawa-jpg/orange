<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オレンジ社内</title>
<!-- ホーム画面のアイコン -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オレンジ社内">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f18b00">
<style>
  html,body{margin:0;height:100%;background:#f5f1ec}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  @media (prefers-color-scheme:dark){html,body{background:#1a1613}}
</style>
</head>
<body>
<!-- ポータル本体(Apps Script)のURL -->
<iframe id="f" title="オレンジ社内" allow="clipboard-write"></iframe>
<script>
var URL_ = "https://script.google.com/macros/s/AKfycbx_V1bx62b_g4RAUE3Q1r7M9H-AFqvL-tuGoLx5NhG_IGOoZEv-WXPpmEXP2V7DkobtoA/exec";
var f = document.getElementById("f");
// 毎回いちばん新しい画面を読み込む
f.src = URL_ + "?v=" + Date.now();
// 10分以上ほかのアプリを見ていたら、戻ったときに読み込み直す
var hiddenAt = 0;
document.addEventListener("visibilitychange", function () {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) f.src = URL_ + "?v=" + Date.now();
  hiddenAt = 0;
});
// 音声入力の代行:アプリの中の画面(Googleの枠の中)はマイクが使えないため、この入口ページが聞き取って文字を送り返す
// iPhoneは聞き取りを毎回作り直すと2回目から音が入らないため、1つを使い回す
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var R = null, tgt = null, running = false, pending = null;
  function send(o) { if (!tgt) return; o.type = "orange-mic"; o.id = tgt.id; try { tgt.src.postMessage(o, tgt.org); } catch (x) {} }
  function make() {
    var r = new SR();
    r.lang = "ja-JP"; r.continuous = true; r.interimResults = true;
    r.onstart = function () { running = true; send({ state: "started" }); };
    ["audiostart", "soundstart", "speechstart", "speechend", "audioend", "nomatch"].forEach(function (k) { r["on" + k] = function () { send({ state: "info", info: k }); }; });
    r.onresult = function (ev) { var s = ""; for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; send({ state: "text", text: s }); };
    r.onerror = function (ev) { send({ state: "error", error: ev.error }); };
    r.onend = function () { running = false; send({ state: "end" }); if (pending) { var p = pending; pending = null; begin(p); } };
    return r;
  }
  function begin(t) {
    tgt = t;
    if (!R) R = make();
    try { R.start(); }
    catch (x) {
      R = make();
      try { R.start(); } catch (y) { send({ state: "error", error: "start" }); send({ state: "end" }); }
    }
  }
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "orange-mic") return;
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    var t = { src: e.source, org: e.origin, id: d.id };
    if (d.action === "stop") { if (running && tgt && tgt.id === d.id) { try { R.stop(); } catch (x) {} } return; }
    if (d.action !== "start") return;
    if (!SR) { tgt = t; send({ state: "error", error: "unsupported" }); send({ state: "end" }); return; }
    if (running) { pending = t; try { R.stop(); } catch (x) {} return; }
    begin(t);
  });
})();
</script>
</body>
</html>
